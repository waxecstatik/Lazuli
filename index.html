<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LAZULI OM-LZ</title>
  <style>
    :root {
      --bg: #121013;
      --chassis: #d6cebf;
      --chassis-dark: #b8af9d;
      --chassis-border: #918877;
      --velvet: #421019;
      --velvet-deep: #22080d;
      --gold: #d4af37;
      --cream: #f4eedb;
      --ink: #1b1614;
      --led-off: #332024;
      --led-on: #5bf0a5;
      --led-stop: #ff3b30;
      --accent-bloom: #e85d75;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    #awaken-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 10, 0.96);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-box {
      border: 2px solid var(--gold);
      background: var(--velvet-deep);
      padding: 28px 20px;
      text-align: center;
      border-radius: 8px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }
    .modal-title {
      font-size: 2rem;
      letter-spacing: 0.25em;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 6px;
    }
    .modal-sub {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #dfcad0;
      margin-bottom: 20px;
    }
    .awaken-btn {
      appearance: none;
      border: 1px solid var(--gold);
      background: linear-gradient(180deg, #611825 0%, #350c14 100%);
      color: #fff;
      padding: 14px 28px;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 700;
      width: 100%;
    }
    .instrument {
      width: 100%;
      max-width: 960px;
      background: linear-gradient(145deg, var(--chassis), var(--chassis-dark));
      border: 3px solid var(--chassis-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--chassis-border);
      padding-bottom: 10px;
    }
    .badge-name {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--ink);
    }
    .master-power-btn {
      appearance: none;
      background: #1b070b;
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .led-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--led-off);
      transition: all 0.2s;
    }
    .led-dot.run {
      background: var(--led-on);
      box-shadow: 0 0 8px var(--led-on);
    }
    .led-dot.stopped {
      background: var(--led-stop);
      box-shadow: 0 0 8px var(--led-stop);
    }
    .power-label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--cream);
    }
    .console-grid {
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 12px;
    }
    @media (max-width: 768px) {
      .console-grid {
        grid-template-columns: 1fr;
      }
    }
    .velvet-bay {
      background: radial-gradient(circle at center, var(--velvet), var(--velvet-deep));
      border: 2px solid #571622;
      border-radius: 8px;
      padding: 12px;
    }
    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chord-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chord-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }
    .chord-btn {
      appearance: none;
      background: #e9e3d5;
      border: 1px solid #7a7060;
      border-bottom: 3px solid #50483c;
      border-radius: 4px;
      padding: 10px 2px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      text-align: center;
    }
    .chord-btn:active, .chord-btn.active {
      background: var(--gold);
      border-bottom-width: 1px;
      transform: translateY(2px);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
    }
    .chord-type-tag {
      font-size: 0.55rem;
      display: block;
      color: #6d6455;
      font-weight: 600;
      margin-top: 1px;
    }
    .macro-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(212, 175, 55, 0.25);
      flex-wrap: wrap;
    }
    .toggle-pill {
      background: #1b070b;
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .song-preset-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--cream);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      padding: 6px 8px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .rhythm-deck {
      display: grid;
      grid-template-columns: repeat(4, 1fr) 1.2fr;
      gap: 6px;
      align-items: center;
    }
    .rhythm-btn {
      appearance: none;
      background: #cfc5b2;
      border: 1px solid #7a7060;
      border-bottom: 2px solid #473f32;
      border-radius: 4px;
      padding: 8px 2px;
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .rhythm-btn.playing {
      background: #a33245;
      color: #fff;
    }
    .strum-canvas-wrap {
      background: #0d0a0b;
      border: 2px solid #571622;
      border-radius: 8px;
      position: relative;
      height: 320px;
      touch-action: none;
      overflow: hidden;
    }
    canvas#strumplate {
      width: 100%;
      height: 100%;
      display: block;
    }
    .fx-bar {
      border-top: 2px solid var(--chassis-border);
      padding-top: 10px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .bloom-trigger-btn {
      appearance: none;
      background: linear-gradient(180deg, #7c1f30 0%, #46101a 100%);
      border: 2px solid var(--accent-bloom);
      color: #fff;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }
    .bloom-trigger-btn.blooming {
      background: var(--accent-bloom);
      box-shadow: 0 0 20px var(--accent-bloom);
    }
    .slider-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #443e36;
      font-weight: 700;
    }
    input[type=range] {
      accent-color: #7c1f30;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="awaken-modal">
    <div class="modal-box">
      <div class="modal-title">LAZULI</div>
      <div class="modal-sub">Model OM-LZ // Mobile Omnichord</div>
      <button class="awaken-btn" id="awaken-action-btn">Awaken Engine</button>
    </div>
  </div>

  <div class="instrument">
    <div class="header-bar">
      <div>
        <div class="badge-name">LAZULI</div>
      </div>
      <button class="master-power-btn" id="power-toggle">
        <div class="led-dot run" id="power-led"></div>
        <span class="power-label" id="power-label">ENGINE: RUN</span>
      </button>
    </div>

    <div class="console-grid">
      <div class="left-deck">
        <div class="velvet-bay">
          <div class="section-label">
            <span>Chord Generator</span>
            <span id="current-chord-display" style="color: #fff; font-weight: 700;">F MAJOR</span>
          </div>

          <div class="chord-rows">
            <div class="chord-row">
              <button class="chord-btn" data-root="C" data-type="maj">C<span class="chord-type-tag">MAJ</span></button>
              <button class="chord-btn" data-root="D" data-type="maj">D<span class="chord-type-tag">MAJ</span></button>
              <button class="chord-btn" data-root="Eb" data-type="maj">E♭<span class="chord-type-tag">MAJ</span></button>
              <button class="chord-btn active" data-root="F" data-type="maj">F<span class="chord-type-tag">MAJ</span></button>
              <button class="chord-btn" data-root="G" data-type="maj">G<span class="chord-type-tag">MAJ</span></button>
              <button class="chord-btn" data-root="Bb" data-type="maj">B♭<span class="chord-type-tag">MAJ</span></button>
            </div>
            <div class="chord-row">
              <button class="chord-btn" data-root="C" data-type="min">Cm<span class="chord-type-tag">MIN</span></button>
              <button class="chord-btn" data-root="D" data-type="min">Dm<span class="chord-type-tag">MIN</span></button>
              <button class="chord-btn" data-root="E" data-type="min">Em<span class="chord-type-tag">MIN</span></button>
              <button class="chord-btn" data-root="F" data-type="min">Fm<span class="chord-type-tag">MIN</span></button>
              <button class="chord-btn" data-root="G" data-type="min">Gm<span class="chord-type-tag">MIN</span></button>
              <button class="chord-btn" data-root="A" data-type="min">Am<span class="chord-type-tag">MIN</span></button>
            </div>
            <div class="chord-row">
              <button class="chord-btn" data-root="C" data-type="maj7">C7<span class="chord-type-tag">MAJ7</span></button>
              <button class="chord-btn" data-root="Eb" data-type="maj7">E♭7<span class="chord-type-tag">MAJ7</span></button>
              <button class="chord-btn" data-root="F" data-type="maj7">F7<span class="chord-type-tag">MAJ7</span></button>
              <button class="chord-btn" data-root="G" data-type="dom7">G7<span class="chord-type-tag">DOM7</span></button>
              <button class="chord-btn" data-root="Bb" data-type="maj7">B♭7<span class="chord-type-tag">MAJ7</span></button>
              <button class="chord-btn" data-root="D" data-type="min7">Dm7<span class="chord-type-tag">MIN7</span></button>
            </div>
          </div>

          <div class="macro-bar">
            <div class="toggle-pill" id="latch-toggle">
              <div class="led-dot run" id="latch-led"></div>
              <span class="power-label">PAD LATCH</span>
            </div>
            <button class="song-preset-btn" data-prog="space-song">Space Song</button>
            <button class="song-preset-btn" data-prog="lazuli">Lazuli</button>
            <button class="song-preset-btn" data-prog="myth">Myth</button>
          </div>
        </div>

        <div class="velvet-bay" style="margin-top: 8px;">
          <div class="section-label">
            <span>Rhythm</span>
            <span id="bpm-display">92 BPM</span>
          </div>
          <div class="rhythm-deck">
            <button class="rhythm-btn" id="beat-spacesong">Space</button>
            <button class="rhythm-btn" id="beat-lazuli">Lazuli</button>
            <button class="rhythm-btn" id="beat-myth">Myth</button>
            <button class="rhythm-btn" id="beat-stop" style="background:#55483a; color:#fff;">Stop</button>
            <div class="slider-cell">
              <input type="range" id="tempo-slider" min="60" max="130" value="92" />
            </div>
          </div>
        </div>
      </div>

      <div class="right-deck">
        <div class="section-label" style="color: #443e36; margin-bottom: 4px;">
          <span>Sonic Strumplate</span>
          <span style="font-size:0.6rem;">▲ HIGH / ▼ LOW</span>
        </div>
        <div class="strum-canvas-wrap" id="strum-wrap">
          <canvas id="strumplate"></canvas>
        </div>
      </div>
    </div>

    <div class="fx-bar">
      <button class="bloom-trigger-btn" id="bloom-btn">Bloom Wash</button>
      <div class="slider-cell">
        <span>Warmth</span>
        <input type="range" id="filter-slider" min="300" max="4000" value="1600" />
      </div>
      <div class="slider-cell">
        <span>Reverb</span>
        <input type="range" id="reverb-slider" min="0" max="100" value="70" />
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let masterGain = null;
    let warmthFilter = null;
    let reverbGain = null;
    let dryGain = null;
    let isLatched = true;
    let isEngineRunning = true;
    let activePadNodes = [];
    let currentChordNotes = [174.61, 220.00, 261.63];
    let activeRhythmId = null;
    let rhythmStep = 0;
    let currentRhythmPattern = null;
    let isBlooming = false;

    const CHORD_MAP = {
      'C-maj': [130.81, 164.81, 196.00],
      'D-maj': [146.83, 185.00, 220.00],
      'Eb-maj': [155.56, 196.00, 233.08],
      'F-maj': [174.61, 220.00, 261.63],
      'G-maj': [196.00, 246.94, 293.66],
      'Bb-maj': [116.54, 146.83, 174.61],
      'C-min': [130.81, 155.56, 196.00],
      'D-min': [146.83, 174.61, 220.00],
      'E-min': [164.81, 196.00, 246.94],
      'F-min': [174.61, 207.65, 261.63],
      'G-min': [196.00, 233.08, 293.66],
      'A-min': [110.00, 130.81, 164.81],
      'C-maj7': [130.81, 164.81, 196.00, 246.94],
      'Eb-maj7': [155.56, 196.00, 233.08, 293.66],
      'F-maj7': [174.61, 220.00, 261.63, 329.63],
      'G-dom7': [196.00, 246.94, 293.66, 349.23],
      'Bb-maj7': [116.54, 146.83, 174.61, 220.00],
      'D-min7': [146.83, 174.61, 220.00, 261.63]
    };

    function buildImpulse(duration, decay) {
      const sampleRate = audioCtx.sampleRate;
      const length = sampleRate * duration;
      const impulse = audioCtx.createBuffer(2, length, sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = impulse.getChannelData(c);
        for (let i = 0; i < length; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * decay));
        }
      }
      return impulse;
    }

    async function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (!masterGain) {
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.7, audioCtx.currentTime);

        warmthFilter = audioCtx.createBiquadFilter();
        warmthFilter.type = 'lowpass';
        warmthFilter.frequency.setValueAtTime(1600, audioCtx.currentTime);

        dryGain = audioCtx.createGain();
        dryGain.gain.setValueAtTime(0.65, audioCtx.currentTime);

        reverbGain = audioCtx.createGain();
        reverbGain.gain.setValueAtTime(0.7, audioCtx.currentTime);

        const conv = audioCtx.createConvolver();
        conv.buffer = buildImpulse(3.2, 1.6);

        masterGain.connect(warmthFilter);
        warmthFilter.connect(dryGain);
        dryGain.connect(audioCtx.destination);
        warmthFilter.connect(conv);
        conv.connect(reverbGain);
        reverbGain.connect(audioCtx.destination);
      }

      document.getElementById('awaken-modal').style.display = 'none';
      if (isLatched && isEngineRunning && activePadNodes.length === 0) {
        playPadChord(currentChordNotes);
      }
    }

    document.getElementById('awaken-modal').addEventListener('click', initAudio);
    document.getElementById('awaken-action-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
    });

    function stopPadChord() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      activePadNodes.forEach(ng => {
        ng.gain.gain.setValueAtTime(ng.gain.gain.value, now);
        ng.gain.gain.linearRampToValueAtTime(0.0001, now + 0.5);
        setTimeout(() => {
          try { ng.oscs.forEach(o => o.stop()); } catch(e) {}
        }, 550);
      });
      activePadNodes = [];
    }

    function playPadChord(frequencies) {
      if (!audioCtx || !isEngineRunning) return;
      stopPadChord();
      const now = audioCtx.currentTime;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.22, now + 0.8);
      g.connect(masterGain);

      const oscs = [];
      frequencies.forEach(freq => {
        [-3, 3].forEach(cents => {
          const osc = audioCtx.createOscillator();
          osc.type = cents < 0 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc.detune.setValueAtTime(cents, now);
          osc.connect(g);
          osc.start(now);
          oscs.push(osc);
        });
      });
      activePadNodes.push({ gain: g, oscs: oscs });
    }

    function triggerHarpNote(freq) {
      if (!audioCtx || !isEngineRunning) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now);
      osc.stop(now + 2.1);
    }

    function playDrum(type) {
      if (!audioCtx || !isEngineRunning) return;
      const now = audioCtx.currentTime;
      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(34, now + 0.16);
        g.gain.setValueAtTime(0.6, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.23);
      } else if (type === 'snare') {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const n = audioCtx.createBufferSource();
        n.buffer = buf;
        const f = audioCtx.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.setValueAtTime(1400, now);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.28, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        n.connect(f);
        f.connect(g);
        g.connect(masterGain);
        n.start(now);
      } else if (type === 'hat') {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(6500, now);
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    function stepRhythm() {
      if (!isEngineRunning || !currentRhythmPattern) return;
      const bpm = parseInt(document.getElementById('tempo-slider').value);
      const interval = (60 / bpm / 2) * 1000;

      if (currentRhythmPattern === 'spacesong') {
        if (rhythmStep % 8 === 0) playDrum('kick');
        if (rhythmStep % 8 === 4) playDrum('snare');
        playDrum('hat');
      } else if (currentRhythmPattern === 'lazuli') {
        if (rhythmStep % 4 === 0 || rhythmStep % 4 === 3) playDrum('kick');
        if (rhythmStep % 4 === 2) playDrum('snare');
        playDrum('hat');
      } else if (currentRhythmPattern === 'myth') {
        if (rhythmStep % 6 === 0) playDrum('kick');
        if (rhythmStep % 6 === 3) playDrum('snare');
        if (rhythmStep % 2 === 0) playDrum('hat');
      }

      rhythmStep++;
      activeRhythmId = setTimeout(stepRhythm, interval);
    }

    function startRhythm(pat) {
      initAudio();
      stopRhythm();
      currentRhythmPattern = pat;
      rhythmStep = 0;
      stepRhythm();
    }

    function stopRhythm() {
      if (activeRhythmId) clearTimeout(activeRhythmId);
      activeRhythmId = null;
      currentRhythmPattern = null;
      document.querySelectorAll('.rhythm-btn').forEach(b => {
        if (b.id !== 'beat-stop') b.classList.remove('playing');
      });
    }

    // Master Power Toggle
    document.getElementById('power-toggle').addEventListener('click', () => {
      isEngineRunning = !isEngineRunning;
      const pLed = document.getElementById('power-led');
      const pLabel = document.getElementById('power-label');
      if (isEngineRunning) {
        pLed.className = 'led-dot run';
        pLabel.innerText = 'ENGINE: RUN';
        if (isLatched) playPadChord(currentChordNotes);
      } else {
        pLed.className = 'led-dot stopped';
        pLabel.innerText = 'ENGINE: STOPPED';
        stopPadChord();
        stopRhythm();
      }
    });

    // Chords
    document.querySelectorAll('.chord-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        initAudio();
        document.querySelectorAll('.chord-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const root = btn.dataset.root;
        const type = btn.dataset.type;
        currentChordNotes = CHORD_MAP[`${root}-${type}`] || [174.61, 220.00, 261.63];
        document.getElementById('current-chord-display').innerText = `${root.toUpperCase()} ${type.toUpperCase()}`;
        if (isLatched && isEngineRunning) playPadChord(currentChordNotes);
      });
    });

    // Latch
    document.getElementById('latch-toggle').addEventListener('click', () => {
      isLatched = !isLatched;
      const led = document.getElementById('latch-led');
      if (isLatched) {
        led.classList.add('run');
        if (isEngineRunning) playPadChord(currentChordNotes);
      } else {
        led.classList.remove('run');
        stopPadChord();
      }
    });

    // Rhythms
    document.getElementById('beat-spacesong').addEventListener('click', function() {
      this.classList.add('playing');
      document.getElementById('beat-lazuli').classList.remove('playing');
      document.getElementById('beat-myth').classList.remove('playing');
      startRhythm('spacesong');
    });
    document.getElementById('beat-lazuli').addEventListener('click', function() {
      this.classList.add('playing');
      document.getElementById('beat-spacesong').classList.remove('playing');
      document.getElementById('beat-myth').classList.remove('playing');
      startRhythm('lazuli');
    });
    document.getElementById('beat-myth').addEventListener('click', function() {
      this.classList.add('playing');
      document.getElementById('beat-spacesong').classList.remove('playing');
      document.getElementById('beat-lazuli').classList.remove('playing');
      startRhythm('myth');
    });
    document.getElementById('beat-stop').addEventListener('click', stopRhythm);

    document.getElementById('tempo-slider').addEventListener('input', (e) => {
      document.getElementById('bpm-display').innerText = `${e.target.value} BPM`;
    });

    // FX
    document.getElementById('filter-slider').addEventListener('input', (e) => {
      if (warmthFilter && audioCtx) warmthFilter.frequency.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05);
    });
    document.getElementById('reverb-slider').addEventListener('input', (e) => {
      if (reverbGain && audioCtx) reverbGain.gain.setTargetAtTime(parseFloat(e.target.value) / 100, audioCtx.currentTime, 0.05);
    });

    // Bloom
    const bloom = document.getElementById('bloom-btn');
    function bloomStart() {
      initAudio();
      bloom.classList.add('blooming');
      if (warmthFilter && audioCtx) warmthFilter.frequency.linearRampToValueAtTime(5000, audioCtx.currentTime + 0.4);
      if (reverbGain && audioCtx) reverbGain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.4);
    }
    function bloomEnd() {
      bloom.classList.remove('blooming');
      const fv = parseFloat(document.getElementById('filter-slider').value);
      const rv = parseFloat(document.getElementById('reverb-slider').value) / 100;
      if (warmthFilter && audioCtx) warmthFilter.frequency.linearRampToValueAtTime(fv, audioCtx.currentTime + 1.0);
      if (reverbGain && audioCtx) reverbGain.gain.linearRampToValueAtTime(rv, audioCtx.currentTime + 1.0);
    }
    bloom.addEventListener('mousedown', bloomStart);
    window.addEventListener('mouseup', bloomEnd);
    bloom.addEventListener('touchstart', (e) => { e.preventDefault(); bloomStart(); });
    window.addEventListener('touchend', bloomEnd);

    // Strumplate
    const canvas = document.getElementById('strumplate');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    let lastSegment = -1;

    function resize() {
      const wrap = document.getElementById('strum-wrap');
      width = canvas.width = wrap.clientWidth;
      height = canvas.height = wrap.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function renderLoop() {
      ctx.clearRect(0, 0, width, height);
      const segs = 24;
      const sh = height / segs;
      for (let i = 0; i < segs; i++) {
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.16)';
        ctx.beginPath();
        ctx.moveTo(0, i * sh);
        ctx.lineTo(width, i * sh);
        ctx.stroke();
      }
      for (let p = particles.length - 1; p >= 0; p--) {
        const pt = particles[p];
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        ctx.fill();
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.radius *= 0.94;
        if (pt.radius < 0.5) particles.splice(p, 1);
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function onStrum(clientY) {
      if (!isEngineRunning) return;
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const relY = Math.max(0, Math.min(height, clientY - rect.top));
      
      const invertedFraction = 1 - (relY / height);
      const segment = Math.floor(invertedFraction * 24);

      if (segment !== lastSegment) {
        lastSegment = segment;
        const noteIdx = segment % currentChordNotes.length;
        const octMultiplier = Math.pow(2, Math.floor(segment / currentChordNotes.length) - 1);
        const freq = currentChordNotes[noteIdx] * octMultiplier;
        triggerHarpNote(freq);

        for (let i = 0; i < 5; i++) {
          particles.push({
            x: Math.random() * width,
            y: relY,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 2,
            radius: Math.random() * 4 + 2,
            color: '#e6cf8b'
          });
        }
      }
    }

    let touching = false;
    canvas.addEventListener('touchstart', (e) => {
      touching = true;
      if (e.touches[0]) onStrum(e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (touching && e.touches[0]) onStrum(e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', () => {
      touching = false;
      lastSegment = -1;
    });

    // Song Presets
    document.querySelectorAll('.song-preset-btn').forEach(b => {
      b.addEventListener('click', () => {
        initAudio();
        const p = b.dataset.prog;
        if (p === 'space-song') {
          document.querySelector('[data-root="Eb"][data-type="maj"]').click();
          document.getElementById('beat-spacesong').click();
          document.getElementById('tempo-slider').value = 74;
          document.getElementById('bpm-display').innerText = '74 BPM';
        } else if (p === 'lazuli') {
          document.querySelector('[data-root="F"][data-type="maj"]').click();
          document.getElementById('beat-lazuli').click();
          document.getElementById('tempo-slider').value = 108;
          document.getElementById('bpm-display').innerText = '108 BPM';
        } else if (p === 'myth') {
          document.querySelector('[data-root="F"][data-type="maj7"]').click();
          document.getElementById('beat-myth').click();
          document.getElementById('tempo-slider').value = 90;
          document.getElementById('bpm-display').innerText = '90 BPM';
        }
      });
    });
  </script>
</body>
</html>
